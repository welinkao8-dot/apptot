<style>

<body class="bg-background text-on-background font-body-md text-body-md min-h-screen flex flex-col items-center justify-center overflow-x-hidden">
<!-- Main Container -->
<main class="w-full max-w-[400px] px-edge-margin py-stack-lg flex flex-col items-center justify-center min-h-screen animate-in fade-in duration-700">
<!-- Logo Section -->
<div class="mb-12 flex flex-col items-center space-y-4">
<div class="w-32 h-32 md:w-40 md:h-40 relative flex items-center justify-center">
<img alt="TOT Driver App Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBuZEbti6SMAwT4evFuDyDEr7CW8moeQR0WVoHoiqf4tf3aN5dCitZlog9i5VBBREbFox5N_ixG6FvOowCuhMd_PjtORPk0IA6n2KfqBj2Gx6PVyuIPl39MFVe5zblaqBMdAgQiEYjoFSttiKZaf4nSi99hUd2jVG267mPzvXKvA7nQm_NEKNCHuf0c1d4OrbROYm5_cqUxXUqm7j6oDkeVBg80P05IXMwYrsItbSpPkOGvbo8j-tvaUHDj_jvIOn861hJ3pwc5yJKK"/>
</div>
<div class="text-center">
<h1 class="font-display-lg text-primary text-headline-lg-mobile md:text-headline-lg tracking-tight mb-2">TOT</h1>
<p class="font-label-md text-label-md text-secondary tracking-[0.1em] uppercase">Motorista Profissional</p>
</div>
</div>
<!-- Login Form -->
<form class="w-full space-y-stack-lg" onsubmit="event.preventDefault();">
<!-- Phone Input -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="phone">Número de Telefone</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]">phone_android</span>
</div>
<input class="w-full h-touch-target pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none font-body-md text-body-md placeholder:text-secondary-fixed-dim" id="phone" placeholder="(00) 0 0000-0000" type="tel"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="password">Senha</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full h-touch-target pl-12 pr-12 bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none font-body-md text-body-md placeholder:text-secondary-fixed-dim" id="password" placeholder="Sua senha secreta" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="flex justify-end pt-1">
<a class="font-label-md text-label-md text-primary hover:opacity-80 transition-opacity active:scale-95" href="#">Esqueci minha senha</a>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full h-touch-target bg-primary text-on-primary font-headline-lg-mobile text-body-md rounded-xl action-shadow active:scale-[0.98] transition-all hover:brightness-110 flex items-center justify-center space-x-2" type="submit">
<span class="font-bold tracking-wider">ENTRAR</span>
<span class="material-symbols-outlined">trending_flat</span>
</button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-auto pt-12 text-center">
<p class="font-body-md text-on-surface-variant mb-2">Ainda não tem uma conta?</p>
<a class="font-title-md text-title-md text-primary underline decoration-primary/30 underline-offset-4 hover:decoration-primary transition-all" href="#">Criar uma conta</a>
</div>
<!-- Safety Badge -->
<div class="mt-8 flex items-center space-x-2 text-secondary opacity-60">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="text-[12px] font-label-md uppercase tracking-widest">Ambiente Seguro</span>
</div>
</main>
<!-- Background Decoration (Subtle) -->
<div class="fixed top-0 right-0 w-64 h-64 bg-primary/5 rounded-full blur-[100px] -z-10 translate-x-1/2 -translate-y-1/2"></div>
<div class="fixed bottom-0 left-0 w-80 h-80 bg-tertiary-fixed/10 rounded-full blur-[120px] -z-10 -translate-x-1/3 translate-y-1/3"></div>
<script>
    // Micro-interactions
    document.querySelectorAll('button, a').forEach(el => {
      el.addEventListener('click', function(e) {
        if(this.tagName === 'A' && this.getAttribute('href') === '#') e.preventDefault();
        
        // Ripple effect simulation logic could go here
      });
    });

    // Handle password visibility toggle
    const togglePass = document.querySelector('button .material-symbols-outlined');
    if(togglePass && togglePass.innerText === 'visibility') {
        const passInput = document.getElementById('password');
        togglePass.parentElement.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            togglePass.innerText = isPass ? 'visibility_off' : 'visibility';
        });
    }
  </script>
</body></html>
