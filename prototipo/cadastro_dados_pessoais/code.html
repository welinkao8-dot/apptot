<!DOCTYPE html>

<html lang="pt-br"><head>
<meta charset="utf-8"/>

<title>TOT Driver Registration - Step 1</title>

                        "inverse-surface": "#2e3034",

                        "on-secondary-fixed-variant": "#474746",

                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#ffb1c4",
                        "surface": "#f9f9fe",
                        "on-background": "#1a1c1f",
                        "background": "#f9f9fe",

                        "error": "#ba1a1a",
                        "on-error": "#ffffff",

                    "borderRadius": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            outline: none;
            border-color: #b60059 !important;
            box-shadow: 0 0 0 1px #b60059;
        }
        .pulsing-accent {
            animation: pulse-pink 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-pink {
            0%, 100% { opacity: 1; }
            50% { opacity: .7; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md selection:bg-primary-fixed">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-[0px_4px_12px_rgba(0,0,0,0.1)] flex items-center justify-between px-edge-margin h-touch-target">
<button aria-label="Back" class="active:scale-95 transition-transform p-2 -ml-2 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-display-lg text-[24px] font-extrabold text-primary tracking-tighter">TOT</h1>
<div class="w-10"></div> <!-- Spacer for centering title -->
</header>
<main class="pt-24 pb-12 px-edge-margin max-w-md mx-auto min-h-screen flex flex-col">
<!-- Progress Indicator -->
<div class="flex items-center gap-2 mb-stack-lg">
<div class="h-2 flex-1 rounded-full bg-primary-container"></div>
<div class="h-2 flex-1 rounded-full bg-surface-container-high"></div>
<div class="h-2 flex-1 rounded-full bg-surface-container-high"></div>
</div>
<section class="mb-stack-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-unit">Seja um motorista</h2>
<p class="text-secondary font-body-md">Passo 1: Dados Pessoais</p>
</section>
<!-- Registration Form -->
<form class="space-y-stack-md flex-grow">
<!-- Full Name -->
<div class="space-y-unit">
<label class="font-label-md text-on-surface-variant block" for="full_name">Nome Completo</label>
<div class="relative">
<input class="w-full h-[56px] px-gutter bg-surface-container-lowest border border-outline-variant rounded-xl text-body-md transition-all placeholder:text-secondary-fixed-dim" id="full_name" placeholder="Como no seu RG" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-unit">
<label class="font-label-md text-on-surface-variant block" for="email">E-mail</label>
<div class="relative">
<input class="w-full h-[56px] px-gutter bg-surface-container-lowest border border-outline-variant rounded-xl text-body-md transition-all placeholder:text-secondary-fixed-dim" id="email" placeholder="exemplo@email.com" required="" type="email"/>
</div>
</div>
<!-- Phone -->
<div class="space-y-unit">
<label class="font-label-md text-on-surface-variant block" for="phone">Telefone Celular</label>
<div class="relative">
<input class="w-full h-[56px] px-gutter bg-surface-container-lowest border border-outline-variant rounded-xl text-body-md transition-all placeholder:text-secondary-fixed-dim" id="phone" placeholder="(00) 00000-0000" required="" type="tel"/>
</div>
</div>
<!-- CPF -->
<div class="space-y-unit">
<label class="font-label-md text-on-surface-variant block" for="cpf">CPF</label>
<div class="relative">
<input class="w-full h-[56px] px-gutter bg-surface-container-lowest border border-outline-variant rounded-xl text-body-md transition-all placeholder:text-secondary-fixed-dim" id="cpf" placeholder="000.000.000-00" required="" type="text"/>
</div>
</div>
<!-- Profile Info Graphic (Asymmetric Bento Style Element) -->
<div class="mt-stack-lg p-stack-md bg-primary-fixed rounded-xl flex items-center gap-4 shadow-sm border-l-4 border-primary">
<div class="bg-primary p-2 rounded-full text-white">
<span class="material-symbols-outlined">security</span>
</div>
<div>
<p class="font-title-md text-[14px] leading-tight text-on-primary-fixed-variant">Segurança dos dados</p>
<p class="text-[12px] text-on-surface-variant mt-1">Seus dados estão protegidos sob nossa política de privacidade corporativa.</p>
</div>
</div>
</form>
<!-- Footer Action -->
<div class="mt-stack-lg sticky bottom-0 bg-surface pt-4">
<button class="w-full h-touch-target bg-primary text-on-primary font-bold rounded-xl shadow-[0px_4px_12px_rgba(186,0,89,0.2)] active:scale-95 transition-all flex items-center justify-center gap-2">
                CONTINUAR
                <span class="material-symbols-outlined">chevron_right</span>
</button>
<p class="text-center text-[12px] text-secondary mt-4 px-4">Ao continuar, você concorda em receber comunicações da TOT para fins de cadastro.</p>
</div>
</main>
<!-- Visual Polish: Floating Decor -->
<div class="fixed bottom-24 -right-12 w-48 h-48 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed top-32 -left-12 w-32 h-32 bg-primary/5 rounded-full blur-2xl pointer-events-none"></div>
<script>
        // Simple micro-interaction for input fields
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.previousElementSibling.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.previousElementSibling.classList.remove('text-primary');
            });
        });

        // Simple mask simulation for Phone and CPF (Conceptual)
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', (e) => {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });
    </script>
</body></html>
