<div class="flex items-center gap-stack-sm mb-4">
<span class="flex h-3 w-3 relative">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>

<p class="font-label-md text-label-md text-primary uppercase tracking-wider">Em Viagem</p>

</div>

<div>

<span class="font-label-md text-label-md">Profile</span>
</a>
</nav>
<script>
        // Simple micro-interaction for the "Finalizar" button
        const finalizeBtn = document.querySelector('button.bg-primary');
        finalizeBtn.addEventListener('click', function() {
            this.textContent = "PROCESSANDO...";
            this.classList.add('opacity-80');
            setTimeout(() => {
                this.textContent = "FINALIZADA";
                this.classList.remove('bg-primary');
                this.classList.add('bg-tertiary-container');
            }, 1200);
        });
    </script>
