<!DOCTYPE html>

<style>
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }
        .animate-status-pulse {
            animation: pulse-soft 2s infinite ease-in-out;
        }
        .card-shadow {
            box-shadow: 0 4px 12px rgba(26, 28, 31, 0.1);
        }
        .primary-glow {
            box-shadow: 0 4px 14px rgba(186, 0, 91, 0.25);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f9f9fe;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-sm flex justify-between items-center px-edge-margin h-touch-target">
<div class="flex items-center gap-stack-sm">
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary">
<img class="w-full h-full object-cover" data-alt="A professional portrait of a Brazilian motorcycle taxi driver in his 30s, wearing a high-visibility safety vest over a sleek black jacket. He is smiling confidently at the camera in a modern urban setting with soft morning sunlight. The image has a clean, high-contrast aesthetic with vibrant pink color accents reflecting the brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDHTswfCe_BQH5585qYkzDgWrhTr_8-Tj5GxFMHg0CHlUvIQvTE1jZ4L0W2KQyKmZYPPp9CLB5FSYGN6c7HqySpIf7gt7D0G1uAYdYPwnkGBvm-sgY6hRINLDcHPzR1R2ZM5wMi4BUGsh23NlM4ea_ySL6pHi3RdwDGJzRvmxvovEkL1QUyBsLmfG_ra9I3B00UNMtzwv2PDMNd3l5VQoWnvA2RT3olN3jfQSJOGnSmG_LCfc3tYqWddCSo58bZuAP6w-ZiKrmvZX4k"/>
</div>
<span class="font-display-lg text-title-md font-black text-primary uppercase tracking-tighter">TOT</span>
</div>
<button class="w-touch-target h-touch-target flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/10 transition-transform active:scale-95">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<main class="pt-24 pb-32 px-edge-margin min-h-screen flex flex-col gap-stack-lg">
<!-- Status Indicator -->
<section class="flex flex-col items-center justify-center py-stack-md">
<div class="animate-status-pulse bg-primary-container text-on-primary-container px-6 py-3 rounded-full flex items-center gap-stack-sm primary-glow">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">hourglass_top</span>
<h1 class="font-label-md text-label-md tracking-widest uppercase font-bold">Aguardando Pagamento</h1>
</div>
</section>
<!-- Trip Summary Card -->
<div class="bg-surface-container-lowest rounded-xl p-stack-lg card-shadow border-l-4 border-primary relative overflow-hidden">
<div class="flex flex-col gap-unit">
<p class="font-label-md text-on-surface-variant uppercase tracking-wider">Valor Total</p>
<div class="flex items-baseline gap-unit">
<span class="font-headline-lg-mobile text-primary">R$</span>
<span class="font-display-lg text-primary leading-none">18,50</span>
</div>
</div>
<div class="mt-stack-lg pt-stack-lg border-t border-surface-variant flex items-center justify-between">
<div class="flex items-center gap-stack-sm">
<div class="w-12 h-12 bg-surface-container rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-stats-number" data-icon="payments">payments</span>
</div>
<div>
<p class="font-label-md text-on-surface-variant">Método</p>
<p class="font-title-md text-on-surface">Dinheiro</p>
</div>
</div>
<div class="w-2 h-2 rounded-full bg-primary animate-ping"></div>
</div>
</div>
<!-- Passenger Info Card -->
<div class="bg-surface-container-low rounded-xl p-stack-md flex items-center gap-stack-md outline outline-1 outline-surface-variant">
<div class="w-14 h-14 rounded-full overflow-hidden bg-surface-container-highest">
<img class="w-full h-full object-cover" data-alt="A candid profile photo of a young man named Marco Silva, appearing friendly and reliable. He is dressed in casual modern attire, posing in a well-lit outdoor urban plaza. The photo is sharp with professional shallow depth of field, maintaining the bright and high-contrast color scheme of the application's clean design system." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHgJ6mBin-9yR0TCAjIJIx4VKl4bF0fWjZLWRueFfc8Ij_T5St0QSKu5r5YopdavTUaskoBLRlPeHcLes1lSeaw9PK-Zh1LKjzQo6wJp9B8L-u0YLRGZFnvRaB6LmpmpfeJ7UCM202u5HeaoFquXxgnLCLP9J3iMFLMBiWMQn23C0x7VQXebhlRKOyksIVUkAWpeiTKQP9C8d0BCQpB6i4zViiMkVWc5F3iaqH7L4GVF_b-ockdi9vd6MDDFG3ZsW3aYMpZ046V0aG"/>
</div>
<div class="flex-1">
<p class="font-label-md text-on-surface-variant">Passageiro</p>
<h3 class="font-title-md text-on-surface">Marco Silva</h3>
</div>
<div class="flex items-center gap-1 bg-surface-container-highest px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-[18px] text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-label-md text-on-surface font-bold">4.9</span>
</div>
</div>
<!-- Instructions (Subtle) -->
<div class="mt-auto py-stack-md text-center">
<p class="font-body-md text-on-surface-variant italic">
                Aguarde o passageiro realizar o pagamento antes de confirmar.
            </p>
</div>
<!-- Confirmation Button -->
<div class="flex flex-col gap-stack-sm">
<button class="w-full h-16 bg-primary text-on-primary rounded-xl font-headline-lg-mobile flex items-center justify-center gap-stack-sm primary-glow transition-all active:scale-[0.98] hover:bg-primary-container">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                CONFIRMAR RECEBIMENTO
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-edge-margin py-2 bg-surface shadow-[0_-4px_12px_rgba(186,0,91,0.1)] rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-primary/5 transition-all duration-200 active:scale-90">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md mt-1">Início</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-primary/5 transition-all duration-200 active:scale-90">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label-md text-label-md mt-1">Ganhos</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-primary/5 transition-all duration-200 active:scale-90">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-md text-label-md mt-1">Histórico</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-primary/5 transition-all duration-200 active:scale-90">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-label-md mt-1">Perfil</span>
</button>
</nav>
<script>
        // Micro-interaction for confirmation button
        const confirmBtn = document.querySelector('button.bg-primary');
        confirmBtn.addEventListener('click', () => {
            confirmBtn.classList.add('scale-95');
            confirmBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> PROCESSANDO...';
            setTimeout(() => {
                confirmBtn.innerHTML = '<span class="material-symbols-outlined">verified</span> SUCESSO';
                confirmBtn.classList.remove('bg-primary');
                confirmBtn.classList.add('bg-tertiary');
            }, 1500);
        });

        // Set active nav item logic (Home is likely active context here)
        const navButtons = document.querySelectorAll('nav button');
        const homeBtn = navButtons[0];
        homeBtn.className = "flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-all duration-200 active:scale-90";
    </script>
</body></html>
