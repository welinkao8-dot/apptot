<!-- Scripts -->
<script>
        // Countdown Timer Logic
        let seconds = 15;
        const timerEl = document.getElementById('timer');
        const countdownInterval = setInterval(() => {
            seconds--;
            if (timerEl) timerEl.innerText = seconds;
            
            if (seconds <= 5) {
                timerEl?.parentElement?.classList.add('bg-error', 'text-on-error');
                timerEl?.parentElement?.classList.remove('bg-primary-container', 'text-on-primary-container');
            }
            
            if (seconds <= 0) {
                clearInterval(countdownInterval);
                alert('O tempo para aceitar a corrida expirou.');
            }
        }, 1000);

        // Carousel Logic
        const carousel = document.getElementById('carousel');
        const dots = [document.getElementById('dot-0'), document.getElementById('dot-1')];
        
        carousel.addEventListener('scroll', () => {
            const index = Math.round(carousel.scrollLeft / carousel.offsetWidth);
            dots.forEach((dot, i) => {
                if (i === index) {
                    dot.classList.add('bg-primary');
                    dot.classList.remove('bg-on-surface/20');
                } else {
                    dot.classList.remove('bg-primary');
                    dot.classList.add('bg-on-surface/20');
                }
            });
        });

        // Auto-slide carousel
        let currentSlide = 0;
        setInterval(() => {
            currentSlide = (currentSlide + 1) % 2;
            carousel.scrollTo({
                left: currentSlide * carousel.offsetWidth,
                behavior: 'smooth'
            });
        }, 4000);

        // Button actions
        document.getElementById('btn-accept').addEventListener('click', function() {
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> PROCESSANDO...';
            this.disabled = true;
            setTimeout(() => {
                alert('Corrida aceita! Iniciando navegação.');
            }, 800);
        });

        document.getElementById('btn-reject').addEventListener('click', function() {
            if(confirm('Tem certeza que deseja rejeitar esta corrida?')) {
                window.location.reload();
            }
        });
    </script>
