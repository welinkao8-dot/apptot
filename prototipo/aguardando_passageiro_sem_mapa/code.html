<div class="flex items-baseline justify-center gap-1">
<span class="font-display-lg text-[32px] text-primary">12</span>
<span class="font-title-md text-on-surface">min</span>
</div>
</div>

<span class="material-symbols-outlined text-tertiary text-[20px]">location_on</span>
</div>
<div class="flex flex-col gap-stack-md flex-1">

<script>
        // Micro-interaction for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('mouseup', () => {
                button.classList.remove('scale-95');
            });
        });
    </script>
