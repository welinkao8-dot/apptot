services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
    volumes:
      - tot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Run explicitly before deploying a release: docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    profiles: ["migrations"]
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: ["npm", "run", "db:migrate:deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required and must use host db}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  admin-api:
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: ["node", "dist/apps/admin-api/main.js"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_RATE_LIMIT_LIMIT: ${API_RATE_LIMIT_LIMIT:-120}
      API_RATE_LIMIT_TTL_MS: ${API_RATE_LIMIT_TTL_MS:-60000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required and must use host db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      DRIVER_API_URL: http://driver-api:3004
      ADMIN_API_URL: ${ADMIN_API_URL:?ADMIN_API_URL is required for public uploads}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
    ports:
      - "${ADMIN_API_HOST_PORT:-3000}:3000"
    volumes:
      - admin_uploads:/app/backend-monorepo/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  client-api:
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: ["node", "dist/apps/client-api/main.js"]
    environment:
      NODE_ENV: production
      PORT: "3001"
      API_RATE_LIMIT_LIMIT: ${API_RATE_LIMIT_LIMIT:-120}
      API_RATE_LIMIT_TTL_MS: ${API_RATE_LIMIT_TTL_MS:-60000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required and must use host db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      HERE_ROUTING_API_KEY: ${HERE_ROUTING_API_KEY:?HERE_ROUTING_API_KEY is required for quotes}
      HERE_MAP_API_KEY: ${HERE_MAP_API_KEY:?HERE_MAP_API_KEY is required for browser maps}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
    ports:
      - "${CLIENT_API_HOST_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  driver-api:
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: ["node", "dist/apps/driver-api/main.js"]
    environment:
      NODE_ENV: production
      PORT: "3004"
      API_RATE_LIMIT_LIMIT: ${API_RATE_LIMIT_LIMIT:-120}
      API_RATE_LIMIT_TTL_MS: ${API_RATE_LIMIT_TTL_MS:-60000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required and must use host db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
    ports:
      - "${DRIVER_API_HOST_PORT:-3004}:3004"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3004/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- FRONTEND PORTALS ---
  admin-portal:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        PORTAL_PATH: admin-portal/frontend
        VITE_API_URL: ${ADMIN_API_URL:?ADMIN_API_URL is required for admin portal}

  client-portal:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        PORTAL_PATH: client-portal/frontend
        VITE_API_URL: ${CLIENT_API_URL}
        VITE_SOCKET_URL: ${DRIVER_API_SOCKET_URL}
        VITE_HERE_API_KEY: ${HERE_MAP_API_KEY:?HERE_MAP_API_KEY is required for browser maps}

  driver-portal:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        PORTAL_PATH: driver-portal/frontend
        VITE_API_URL: ${DRIVER_API_URL}
        VITE_SOCKET_URL: ${DRIVER_API_SOCKET_URL}
        VITE_HERE_API_KEY: ${HERE_MAP_API_KEY:?HERE_MAP_API_KEY is required for browser maps}

  # --- INSTITUTIONAL ---
  landing-page:
    build:
      context: ./landing-page
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped

  landing-frota:
    build:
      context: ./landing-frota
      dockerfile: Dockerfile
    ports:
      - "81:80"
    restart: unless-stopped

volumes:
  tot_data:
  admin_uploads:
